[package]
name = "fs-addon-toolkit"
version = "1.1.0"
description = "FS Addon Toolkit – menedżer dodatków Community dla Microsoft Flight Simulator 2024 i 2020"
authors = ["Adam Rędzikowski"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "fs_addon_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
rayon = "1"
walkdir = "2"
regex = "1"
once_cell = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
roxmltree = "0.21"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
